  #dim-overlay {
    position: fixed; inset: 0;
    background: #000; opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
    z-index: 1;
  }
  #dim-overlay.active { opacity: 0.82; }

  .screen {
    position: absolute; inset: 0;
    display: none; opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(.22,.9,.36,1);
    pointer-events: none;
    z-index: 2;
  }
  .screen.active {
    display: block; opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  #screen-choice {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }

  #screen-final {
    display: none;
    z-index: 45;
  }
  #screen-final.active {
    display: block;
    opacity: 1;
    transform: none;
  }

  #screen-yes, #screen-no { z-index: 5; }

  .heart-canvas {
    position: absolute; inset: 0;
    z-index: 10; pointer-events: none;
    background: transparent;
  }

  /* ==========================================================
     ЭКРАН 1: ПРИВЕТСТВИЕ
     ========================================================== */

  #screen-hello {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 20;
  }

  .greet-panel {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: min(88vw, 560px);
    padding: 20px 24px;
    background: rgba(26, 26, 46, 0.88);
    border-radius: 22px;
    color: #fff;
    font-size: clamp(14px, 4vw, 18px);
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    white-space: pre-line;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .btn-start {
    position: absolute;
    left: 50%;
    top: 62%;
    transform: translateX(-50%);
    padding: 16px 48px;
    background: rgb(255, 214, 224);
    color: #5a2a3a;
    font-family: inherit;
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 700;
    border: none;
    border-radius: 22px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    z-index: 5;
  }
  .btn-start:hover { background: rgb(255, 228, 236); }
  .btn-start:active { transform: translateX(-50%) scale(0.96); }

  /* ==========================================================
     ЭКРАН 2: КОНВЕРТ
     ========================================================== */

  #screen-greet {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    perspective: 1600px;
    z-index: 20;
  }

  .envelope-scene {
    position: relative;
    width: min(70vw, 340px);
    height: min(48vw, 230px);
    transform-style: preserve-3d;
    cursor: pointer;
    transition: transform 0.4s ease;
    z-index: 20;
  }
  .envelope-scene:active { transform: scale(0.97); }

  .env-body {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, #fdf1f5 0%, #f6d9e4 55%, #edc4d4 100%);
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.35);
    z-index: 3;
    overflow: hidden;
  }
  .env-body::before {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom right, transparent 49.4%, rgba(180,130,150,0.35) 49.6%, rgba(180,130,150,0.35) 50.4%, transparent 50.6%),
      linear-gradient(to bottom left,  transparent 49.4%, rgba(180,130,150,0.35) 49.6%, rgba(180,130,150,0.35) 50.4%, transparent 50.6%);
    pointer-events: none;
  }
  .env-body::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 58%;
    background: linear-gradient(180deg, #f9e3ec 0%, #efcad9 100%);
    clip-path: polygon(0 100%, 50% 0, 100% 100%);
    box-shadow: 0 -2px 6px rgba(150,90,120,0.25);
    pointer-events: none;
  }

  .env-letter {
    position: absolute;
    left: 6%; right: 6%;
    top: 10%;
    height: 88%;
    background: linear-gradient(180deg, #ffffff 0%, #fbf6f8 100%);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    z-index: 2;
    transform: translateY(0) scale(0.96);
    opacity: 0;
    transition: transform 0.9s cubic-bezier(.22,.9,.36,1) 0.75s,
                opacity   0.6s ease 0.75s;
    padding: 16px;
    overflow: hidden;
  }
  .env-letter-lines {
    display: flex; flex-direction: column; gap: 8px;
    opacity: 0;
    transition: opacity 0.6s ease 1.3s;
  }
  .env-letter-lines span {
    display: block;
    height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, #d8b8d0 0%, #e8c8dc 100%);
  }
  .env-letter-lines span:nth-child(1) { width: 70%; }
  .env-letter-lines span:nth-child(2) { width: 90%; }
  .env-letter-lines span:nth-child(3) { width: 55%; }
  .env-letter-lines span:nth-child(4) { width: 82%; }
  .env-letter-lines span:nth-child(5) { width: 63%; }

  .env-flap {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 58%;
    background: linear-gradient(180deg, #fdeef4 0%, #f3cada 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 0.85s cubic-bezier(.6,.05,.28,1);
    z-index: 4;
    box-shadow: 0 4px 10px rgba(150,90,120,0.3);
    backface-visibility: hidden;
  }
  .env-flap-inner {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #f7dbe6 0%, #e9b9cd 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    opacity: 0;
    transition: opacity 0.4s ease 0.4s;
  }

  .env-seal {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%) scale(1);
    width: 54px; height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9db4 0%, #e35d80 55%, #b8355a 100%);
    box-shadow: 0 4px 12px rgba(180,40,80,0.55), inset 0 0 8px rgba(255,255,255,0.45);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px;
    z-index: 6;
    transition: transform 0.4s ease, opacity 0.4s ease;
    text-shadow: 0 1px 2px rgba(120,20,50,0.6);
  }

  .env-hint {
    margin-top: 22px;
    color: #3d1a5c;
    font-size: clamp(13px, 3.8vw, 15px);
    font-weight: 700;
    letter-spacing: 0.3px;
    opacity: 0.9;
    animation: hintPulse 2s ease-in-out infinite;
    z-index: 5;
    transition: opacity 0.4s ease;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.5);
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.6; transform: translateY(0); }
    50%      { opacity: 1;   transform: translateY(-3px); }
  }

  .envelope-scene.opening .env-flap {
    transform: rotateX(-180deg);
  }
  .envelope-scene.opening .env-flap-inner {
    opacity: 1;
  }
  .envelope-scene.opening .env-seal {
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
  }
  .envelope-scene.opening .env-letter {
    transform: translateY(-58%) scale(1);
    opacity: 1;
  }
  .envelope-scene.opening .env-letter-lines {
    opacity: 1;
  }
  .envelope-scene.opening .env-hint {
    opacity: 0;
  }

  .envelope-scene.shake {
    animation: envShake 0.5s ease;
  }
  @keyframes envShake {
    0%,100% { transform: rotate(0deg); }
    20%     { transform: rotate(-1.6deg); }
    45%     { transform: rotate(1.4deg); }
    70%     { transform: rotate(-0.8deg); }
  }

  /* ==========================================================
     РАСПРАВЛЯЮЩИЙСЯ ЛИСТ
     ========================================================== */

  #expanding-paper {
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(60vw, 240px);
    height: min(42vw, 170px);
    transform: translate(-50%, -50%) rotate(-1deg);
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition:
      width 1.05s cubic-bezier(.22,.9,.36,1) 0.15s,
      height 1.05s cubic-bezier(.22,.9,.36,1) 0.15s,
      border-radius 1.05s ease 0.15s,
      transform 1.05s cubic-bezier(.22,.9,.36,1) 0.15s,
      opacity 0.45s ease;
    overflow: hidden;
  }

  #expanding-paper.show { opacity: 1; }

  #expanding-paper.expanded {
    width: min(92vw, 560px);
    height: min(78vh, 620px);
    border-radius: 16px;
    transform: translate(-50%, -50%) rotate(0deg);
  }

  #expanding-paper::before {
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(180deg,
        rgba(180,150,180,0.10) 0px,
        rgba(180,150,180,0.10) 1px,
        transparent 1px,
        transparent 26px);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease 0.9s;
  }
  #expanding-paper.expanded::before { opacity: 1; }

  #expanding-paper.crumple {
    transition:
      width 0.75s cubic-bezier(.6,.05,.3,1),
      height 0.75s cubic-bezier(.6,.05,.3,1),
      border-radius 0.75s ease,
      transform 0.75s cubic-bezier(.6,.05,.3,1),
      opacity 0.75s ease 0.1s;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(35deg) scale(0.6);
    opacity: 0;
  }
  #expanding-paper.crumple::before {
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  /* ==========================================================
     ЭКРАН ТЕКСТА — Caveat только здесь
     ========================================================== */

  #screen-text { z-index: 40; }

  .text-panel {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 560px);
    height: min(78vh, 620px);
    display: flex;
    flex-direction: column;
    padding: 32px 26px 82px 26px;
    color: #2a1044;
    background: transparent;
    opacity: 0;
    transition: opacity 0.5s ease 0.9s;
  }
  #screen-text.active .text-panel { opacity: 1; }

  .text-content {
    flex: 1; overflow-y: auto;
    white-space: pre-wrap;
    font-family: 'Caveat', cursive;
    font-size: clamp(20px, 6vw, 26px);
    line-height: 1.35;
    color: #3d1a5c;
    font-weight: 500;
    padding-right: 8px;
    -webkit-overflow-scrolling: touch;
    text-shadow: 0 0 2px rgba(255,255,255,0.6);
  }
  .text-content::-webkit-scrollbar { width: 5px; }
  .text-content::-webkit-scrollbar-thumb { background: #a78ec4; border-radius: 3px; }
  .text-content::-webkit-scrollbar-track { background: transparent; }

  .bottom-buttons {
    position: absolute; left: 0; right: 0; bottom: 16px;
    display: flex; flex-direction: row; flex-wrap: nowrap;
    justify-content: center; align-items: center;
    gap: 8px; padding: 0 16px;
  }

  .btn-small {
    flex: 0 1 auto; min-width: 0;
    padding: 10px 16px;
    font-family: 'Comfortaa', sans-serif;
    font-size: clamp(11px, 3.2vw, 13px);
    font-weight: 700;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.1s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #5a2a3a;
  }
  .btn-small:hover { filter: brightness(1.06); }
  .btn-small:active { transform: scale(0.96); }

  .btn-skip { background: #ffc4d6; box-shadow: 0 4px 12px rgba(255, 150, 185, 0.4); }
  .btn-back { background: #ffb0c8; box-shadow: 0 4px 12px rgba(255, 130, 170, 0.45); }
  .btn-next {
    background: #ff8fb1;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(255, 100, 150, 0.5);
  }

  .btn-small:disabled {
    background: rgba(255, 180, 205, 0.5);
    color: rgba(120, 60, 90, 0.6);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ==========================================================
     ВОПРОС — вырастает из маленького круга
     ========================================================== */

  #screen-choice { z-index: 45; }

  .panel.choice {
    position: absolute;
    top: 50%; left: 50%;
    width: min(92vw, 620px);
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 700; line-height: 1.4;
    white-space: pre-line;
    padding: 34px 28px;
    background: rgba(26, 26, 46, 0.94);
    color: #fff;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);

    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    border-radius: 50%;
    pointer-events: none;
  }

  #screen-choice.active .panel.choice {
    animation: growFromDot 1s cubic-bezier(.22,1.15,.36,1) forwards;
    pointer-events: auto;
  }

  @keyframes growFromDot {
    0% {
      transform: translate(-50%, -50%) scale(0.02) rotate(-35deg);
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }
    15% {
      opacity: 1;
      box-shadow: 0 0 40px rgba(255, 200, 220, 0.7);
    }
    55% {
      transform: translate(-50%, -50%) scale(1.06) rotate(4deg);
      border-radius: 30px;
      box-shadow: 0 0 60px rgba(255, 200, 220, 0.9);
    }
    80% {
      transform: translate(-50%, -50%) scale(0.98) rotate(-1deg);
      border-radius: 28px;
    }
    100% {
      transform: translate(-50%, -50%) scale(1) rotate(0deg);
      border-radius: 28px;
      opacity: 1;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    }
  }

  .choice-buttons {
    display: flex; flex-direction: row; flex-wrap: nowrap;
    justify-content: center; gap: 14px; margin-top: 26px;
  }

  .btn-choice {
    padding: 14px 32px;
    background: rgb(255, 214, 224); color: #5a2a3a;
    font-family: 'Comfortaa', sans-serif;
    font-size: clamp(14px, 4vw, 16px); font-weight: 700;
    border: none; border-radius: 18px; cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
    min-width: 100px;
  }
  .btn-choice:hover { background: rgb(255, 228, 236); }
  .btn-choice:active { transform: scale(0.96); }

  /* 👇 убегающая кнопка "Дя" */
  #choice-yes {
    position: relative;
    transition: transform 0.35s cubic-bezier(.22,1.15,.36,1), background 0.2s ease;
    will-change: transform;
    z-index: 5;
  }
  #choice-yes.runaway {
    background: #ffc4d6;
  }
  #choice-yes.dodge {
    animation: dodgeShake 0.4s ease;
  }
  @keyframes dodgeShake {
    0%,100% { rotate: 0deg; }
    25%     { rotate: -8deg; }
    75%     { rotate: 8deg; }
  }

  .btn-continue {
    position: absolute; left: 50%; bottom: 8%;
    transform: translateX(-50%) translateY(20px);
    padding: 14px 40px;
    background: rgba(255, 214, 224, 0.95); color: #5a2a3a;
    font-family: 'Comfortaa', sans-serif;
    font-size: clamp(14px, 4vw, 16px); font-weight: 700;
    border: none; border-radius: 18px; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
    min-width: 180px; z-index: 50;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }
  .btn-continue.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .btn-continue:hover { background: rgb(255, 228, 236); }
  .btn-continue:active { transform: translateX(-50%) scale(0.96); }

  /* ==========================================================
     ФИНАЛ — падает сверху с тряской
     ========================================================== */

  .panel.final {
    position: absolute;
    top: 22%;
    left: 50%;
    width: min(88vw, 560px);
    max-width: 560px;
    font-size: clamp(15px, 4.5vw, 20px);
    font-weight: 700;
    line-height: 1.5;
    white-space: pre-line;
    padding: 30px 26px;
    background: rgba(26, 26, 46, 0.94);
    color: #fff;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    transform: translate(-50%, -50%) translateY(-120vh);
    opacity: 0;
    pointer-events: none;
  }

  #screen-final.active .panel.final {
    animation: panelDropIn 1.2s cubic-bezier(.22,.9,.35,1) forwards;
    pointer-events: auto;
  }

  @keyframes panelDropIn {
    0% {
      transform: translate(-50%, -50%) translateY(-120vh);
      opacity: 0;
    }
    10% { opacity: 1; }
    65% {
      transform: translate(-50%, -50%) translateY(3vh);
      opacity: 1;
    }
    75% {
      transform: translate(-50%, -50%) translateY(-1.5vh) rotate(-1deg);
    }
    83% {
      transform: translate(-51%, -50%) translateY(1vh) rotate(1deg);
    }
    89% {
      transform: translate(-49%, -50%) translateY(-0.6vh) rotate(-0.6deg);
    }
    94% {
      transform: translate(-50%, -50%) translateY(0.3vh) rotate(0.3deg);
    }
    100% {
      transform: translate(-50%, -50%) translateY(0) rotate(0deg);
      opacity: 1;
    }
  }

  .btn-final {
    position: absolute;
    top: 68%;
    left: 50%;
    padding: 14px 44px;
    background: rgb(255, 214, 224); color: #5a2a3a;
    font-family: 'Comfortaa', sans-serif;
    font-size: clamp(14px, 4vw, 16px); font-weight: 700;
    border: none; border-radius: 18px; cursor: pointer;
    transition: background 0.2s ease;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);

    transform: translateX(-50%) translateY(-120vh);
    opacity: 0;
    pointer-events: none;
  }

  #screen-final.active .btn-final {
    animation: btnDropIn 1s cubic-bezier(.22,.9,.35,1) 0.75s forwards;
    pointer-events: auto;
  }

  @keyframes btnDropIn {
    0% {
      transform: translateX(-50%) translateY(-120vh);
      opacity: 0;
    }
    10% { opacity: 1; }
    65% {
      transform: translateX(-50%) translateY(1.5vh);
    }
    76% {
      transform: translateX(-50.5%) translateY(-0.8vh) rotate(-1deg);
    }
    85% {
      transform: translateX(-49.5%) translateY(0.5vh) rotate(1deg);
    }
    93% {
      transform: translateX(-50%) translateY(-0.3vh) rotate(-0.4deg);
    }
    100% {
      transform: translateX(-50%) translateY(0) rotate(0deg);
      opacity: 1;
    }
  }

  .btn-final:hover { background: rgb(255, 228, 236); }
  .btn-final:active { transform: translateX(-50%) scale(0.96); }

  /* ==========================================================
     ЭФФЕКТ СЕРДЕЧЕК ПРИ КЛИКЕ / ТАПЕ
     ========================================================== */

  .click-heart {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 20px;
    line-height: 1;
    user-select: none;
    will-change: transform, opacity;
    animation: heartBurst 0.9s ease-out forwards;
  }

  @keyframes heartBurst {
    0% {
      transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
      opacity: 1;
    }
    40% { opacity: 1; }
    100% {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot));
      opacity: 0;
    }
  }

  @media (max-width: 380px) {
    .btn-small { font-size: 10px; padding: 9px 12px; border-radius: 14px; }
    .bottom-buttons { gap: 6px; padding: 0 8px; }
    .btn-choice { padding: 12px 22px; min-width: 80px; }
    .env-seal { width: 46px; height: 46px; font-size: 20px; }
    .greet-panel { font-size: 13px; padding: 16px 18px; }
    .panel.final { font-size: 14px; padding: 24px 20px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="dim-overlay"></div>

  <div id="expanding-paper"></div>

  <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
  <div class="screen active" id="screen-hello">
    <div class="greet-panel" id="greet-text">Привет👋. Мне чуть стыдно за это. Но это может быть последний раз когда я что то пишу тебе, да и раз уж пропаду на год то не боюсь ничего</div>
    <button class="btn-start" id="start-btn">Тык</button>
  </div>

  <!-- ЭКРАН 2: КОНВЕРТ -->
  <div class="screen" id="screen-greet">
    <div class="envelope-scene" id="envelope">
      <div class="env-body">
        <div class="env-letter">
          <div class="env-letter-lines">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
      <div class="env-flap">
        <div class="env-flap-inner"></div>
      </div>
      <div class="env-seal">❤</div>
    </div>

    <div class="env-hint" id="env-hint">Тык, чтобы открыть</div>
  </div>

  <!-- ЭКРАН 3: ТЕКСТ -->
  <div class="screen" id="screen-text">
    <div class="text-panel">
      <div class="text-content" id="text-content"></div>
      <div class="bottom-buttons">
        <button class="btn-small btn-skip" id="skip-btn">⏩ Быстрее</button>
        <button class="btn-small btn-back" id="back-btn">◀ Сюда</button>
        <button class="btn-small btn-next" id="next-btn">Туда ▶</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 4: ВЫБОР -->
  <div class="screen" id="screen-choice">
    <div class="panel choice">
      <div>Ты будешь скучать?</div>
      <div class="choice-buttons">
        <button class="btn-choice" id="choice-yes">Дя</button>
        <button class="btn-choice" id="choice-no">Нет</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 5: СЕРДЦЕ ДА -->
  <div class="screen" id="screen-yes">
    <canvas class="heart-canvas" id="heart-canvas-yes"></canvas>
    <button class="btn-continue" id="yes-continue">Дальше ▶</button>
  </div>

  <!-- ЭКРАН 6: СЕРДЦЕ НЕТ -->
  <div class="screen" id="screen-no">
    <canvas class="heart-canvas" id="heart-canvas-no"></canvas>
    <button class="btn-continue" id="no-continue">Дальше ▶</button>
  </div>

  <!-- ЭКРАН 7: ФИНАЛ -->
  <div class="screen" id="screen-final">
    <div class="panel final">
      <div id="final-text"></div>
    </div>
    <button class="btn-final" id="final-btn">Пака 👋</button>
  </div>
</div>

<script>
// ==========================================================
//   ТЕКСТЫ
// ==========================================================

const GREETING = "Привет👋. Мне чуть стыдно за это. Но это может быть последний раз когда я что то пишу тебе, да и раз уж пропаду на год то не боюсь ничего";

const FINISH_TEXT = "Спасибо что прочла 🎉\nЭтот мили котик ты 🙂\nНадеюсь, тебе было интересно так же как и мне, прощай ❤️";

const TYPE_CHUNK = 2;
const TYPE_DELAY = 35;

function dimBackground()   { dimOverlay.classList.add("active"); }
function undimBackground() { dimOverlay.classList.remove("active"); }

function showScreen(el) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  requestAnimationFrame(() => el.classList.add("active"));

  if (el === screenYes || el === screenNo) dimBackground();
  else undimBackground();

  // сброс убегающей кнопки "Дя" при показе экрана выбора
  if (el === screenChoice) {
    choiceYes.style.transform = "";
    choiceYes.classList.remove("runaway", "dodge");
    yesDodgeCount = 0;
  }
}

function hidePaper() {
  expandingPaper.classList.remove("show", "expanded", "crumple");
}

function showPaperExpanded() {
  expandingPaper.classList.remove("expanded", "crumple", "show");
  void expandingPaper.offsetWidth;
  expandingPaper.classList.add("show");
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      expandingPaper.classList.add("expanded");
    });
  });
}

function crumplePaperAndShowChoice() {
  textContent.textContent = "";
  cancelTyping();
  screenText.classList.remove("active");

  expandingPaper.classList.remove("expanded");
  void expandingPaper.offsetWidth;
  expandingPaper.classList.add("crumple");

  setTimeout(() => {
    expandingPaper.classList.remove("show", "crumple");

    screenChoice.classList.remove("active");
    void screenChoice.offsetWidth;
    screenChoice.classList.add("active");

    undimBackground();
  }, 850);
}

function openEnvelope() {

  envelopeOpening = true;

  envelope.classList.add("shake");

    envelope.classList.remove("shake");
    envelope.classList.add("opening");
  }, 480);

    currentStep = 1;
    showTextScreen();

function showTextScreen() {
  nextBtn.textContent = (currentStep === TEXT_FILES.length) ? "Канец ✓" : "Туда ▶";
  showScreen(screenText);
}

function showPart(step) {
  cancelTyping();
  fullText = TEXT_FILES[step - 1] || "[Текст не найден]";
  typedIndex = 0;
  textContent.textContent = "";
  textContent.scrollTop = 0;
  nextBtn.disabled = true;
  typingActive = true;
  typingTimer = setTimeout(typeChunk, TYPE_DELAY);
}

function typeChunk() {
  if (!typingActive) return;
  if (typedIndex < fullText.length) {
    textContent.textContent += fullText.slice(typedIndex, typedIndex + TYPE_CHUNK);
    typedIndex += TYPE_CHUNK;
    typingTimer = setTimeout(typeChunk, TYPE_DELAY);
  } else finishTyping();
}

function finishTyping() {
  typingActive = false; typingTimer = null;
  nextBtn.disabled = false;
}

function skipTyping() {
  if (!typingActive) return;
  if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
  textContent.textContent = fullText;
  typedIndex = fullText.length;
  finishTyping();
}

function cancelTyping() {
  if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
  typingActive = false;
}

// ==========================================================
//   ГЕОМЕТРИЯ СЕРДЦА
// ==========================================================

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x, y };
}

function isInsideHeart(nx, ny, margin) {
  let minDist = Infinity;
  const STEPS = 300;
  for (let i = 0; i < STEPS; i++) {
    const t = (i / STEPS) * Math.PI * 2;
    const p = heartPoint(t);
    const dx = p.x - nx;
    const dy = p.y - ny;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < minDist) minDist = d;
  }
  return minDist > margin;
}

function generateHeartPoints(ringOffsets, wordsOuter) {
  const points = [];
  ringOffsets.forEach((offset, r) => {
    const wordsOnThisRing = Math.max(16, Math.round(wordsOuter - r * 5));
    for (let i = 0; i < wordsOnThisRing; i++) {
      const t = (i / wordsOnThisRing) * Math.PI * 2;
      const p = heartPoint(t);

      const cx0 = 0, cy0 = 3;
      const dirX = cx0 - p.x;
      const dirY = cy0 - p.y;
      const len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
      const normX = dirX / len;
      const normY = dirY / len;

      const nx = p.x + normX * offset;
      const ny = p.y + normY * offset;

      if (isInsideHeart(nx, ny, 0.3)) points.push({ nx, ny });
    }
  });
  return points;
}

// ==========================================================
//   АНИМАЦИЯ СЕРДЦА
// ==========================================================

function startHeartAnimation(canvasId, words, continueBtn) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const screen = canvas.parentElement;
  const W = screen.clientWidth;
  const H = screen.clientHeight;

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(DPR, DPR);

  const CENTER_X = W / 2;
  const CENTER_Y = H / 2 - H * 0.03;

  const USABLE_W = W * 1.02;
  const USABLE_H = H * 0.78;
  const SCALE = Math.min(USABLE_W / 30, USABLE_H / 26);
  const FONT_SIZE = Math.max(11, Math.round(Math.min(W, H) / 55));

  const RING_OFFSETS = [0, 2.2, 4.4, 6.6];
  const WORDS_OUTER = 64;

  const pts = generateHeartPoints(RING_OFFSETS, WORDS_OUTER);
  const particles = [];

  pts.forEach((pt, i) => {
    const targetX = CENTER_X + pt.nx * SCALE;
    const targetY = CENTER_Y - pt.ny * SCALE;

    const angle = Math.random() * Math.PI * 2;
    const radius = Math.max(W, H) * 0.85;
    const startX = CENTER_X + Math.cos(angle) * radius;
    const startY = CENTER_Y + Math.sin(angle) * radius;

    const hasGlow = Math.random() < GLOW_CHANCE;

    particles.push({
      startX, startY, targetX, targetY,
      word: words[i % words.length],
      color: HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)],
      delay: Math.random() * 0.3,
      fontScale: 0.95 + Math.random() * 0.1,
      hasGlow,
      glowBlur: hasGlow ? (12 + Math.random() * 10) : 6,
      glowPhase: Math.random() * Math.PI * 2,
      glowSpeed: 0.8 + Math.random() * 0.8,
    });
  });

  {
    const tBottom = Math.PI;
    const pBottom = heartPoint(tBottom);
    const secretNx = pBottom.x * 0.45;
    const secretNy = pBottom.y + 5.5;
    const secretX = CENTER_X + secretNx * SCALE;
    const secretY = CENTER_Y - secretNy * SCALE;

    const angle = Math.random() * Math.PI * 2;
    const radius = Math.max(W, H) * 0.85;

    particles.push({
      startX: CENTER_X + Math.cos(angle) * radius,
      startY: CENTER_Y + Math.sin(angle) * radius,
      targetX: secretX,
      targetY: secretY,
      word: HEART_SECRET_WORD,
      color: "#ffffff",
      delay: 0.45,
      isSecret: true,
      fontScale: 1.0,
      hasGlow: true,
      glowBlur: 10,
      glowPhase: 0,
      glowSpeed: 0,
    });
  }

  const BUILD_DURATION = 2.0;
  const PULSE_DURATION = 6.0;

  let startTime = null;
  let continueShown = false;

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function drawFrame(now) {
    if (startTime === null) startTime = now;
    const elapsed = (now - startTime) / 1000;
    const progress = Math.min(1, elapsed / BUILD_DURATION);

    ctx.clearRect(0, 0, W, H);

    const pulseT = Math.max(0, elapsed - BUILD_DURATION);
    const pulse = 1 + Math.sin(pulseT * Math.PI * 1.2) * 0.035;

    for (const p of particles) {
      const local = Math.max(0, Math.min(1, (progress - p.delay) / (1 - p.delay || 1)));

      let cx, cy, alpha, scale;
      if (progress < 1) {
        const e = easeOut(local);
        cx = p.startX + (p.targetX - p.startX) * e;
        cy = p.startY + (p.targetY - p.startY) * e;
        alpha = 0.1 + 0.9 * e;
        scale = 0.5 + 0.5 * e;
      } else {
        cx = CENTER_X + (p.targetX - CENTER_X) * pulse;
        cy = CENTER_Y + (p.targetY - CENTER_Y) * pulse;
        alpha = 1;
        scale = 1;
      }

      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.fillStyle = p.color;
      ctx.font = `bold ${FONT_SIZE}px "Comfortaa", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if (p.hasGlow) {
        const flicker = 1 + Math.sin(pulseT * p.glowSpeed + p.glowPhase) * 0.35;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.glowBlur * flicker;
      } else {
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 4;
      }

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale * p.fontScale, scale * p.fontScale);
      ctx.fillText(p.word, 0, 0);
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (!continueShown && elapsed > BUILD_DURATION + 0.5) {
      continueShown = true;
      if (continueBtn) continueBtn.classList.add("show");
    }

    if (elapsed <= BUILD_DURATION + PULSE_DURATION) {
      requestAnimationFrame(drawFrame);
    }
  }

  requestAnimationFrame(drawFrame);
}

//   УБЕГАЮЩАЯ КНОПКА "ДЯ"

function makeYesRunAway() {
  yesDodgeCount++;

  const maxX = Math.min(window.innerWidth * 0.35, 160);
  const maxY = Math.min(window.innerHeight * 0.25, 130);

  const angle = Math.random() * Math.PI * 2;
  const dist  = 40 + Math.random() * 60;

  let dx = Math.cos(angle) * dist;
  let dy = Math.sin(angle) * dist;

  dx = Math.max(-maxX, Math.min(maxX, dx));
  dy = Math.max(-maxY, Math.min(maxY, dy));

  const tilt = (Math.random() * 30 - 15);

  choiceYes.style.transform = `translate(${dx}px, ${dy}px) rotate(${tilt}deg)`;
  choiceYes.classList.add("runaway");

  choiceYes.classList.remove("dodge");
  void choiceYes.offsetWidth;
  choiceYes.classList.add("dodge");

  if (yesDodgeCount > 6) {
    setTimeout(() => {
      choiceYes.style.transform = `translate(${dx * 0.4}px, ${dy * 0.4}px) rotate(0deg)`;
    }, 400);
  }
}

choiceYes.addEventListener("click", (e) => {
  e.preventDefault();
  e.stopPropagation();
  makeYesRunAway();
});

choiceYes.addEventListener("mouseenter", () => {
  makeYesRunAway();
});

choiceYes.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  makeYesRunAway();
});

choiceYes.addEventListener("focus", () => {
  makeYesRunAway();
});

finalBtn.addEventListener("click", () => {
  isFinished = false;
  currentStep = 0;
  showHelloScreen();

nextBtn.addEventListener("click", () => {
  if (typingActive) { skipTyping(); return; }

  if (currentStep < TEXT_FILES.length) {
    currentStep++;
    showTextScreen();
    showPart(currentStep);
  } else {
    crumplePaperAndShowChoice();
  }
});

backBtn.addEventListener("click", () => {
  if (typingActive) { skipTyping(); return; }
  if (currentStep > 1) {
    currentStep--;
    showTextScreen();
    showPart(currentStep);
  } else {
    currentStep = 0;
    isFinished = false;
    showEnvelopeScreen();
  }
});

skipBtn.addEventListener("click", skipTyping);

choiceNo.addEventListener("click", () => {
  noContinue.classList.remove("show");
  hidePaper();
  showScreen(screenNo);
  setTimeout(() => {
    startHeartAnimation("heart-canvas-no", HEART_WORDS_NO, noContinue);
  }, 120);
});

yesContinue.addEventListener("click", () => {

  showFinalScreen();

noContinue.addEventListener("click", () => {

(function initClickHearts() {
  const HEART_SYMBOLS = ["❤", "💕", "💖", "💗", "💓", "💞", "🩷", "♥"];
  const HEART_COLORS  = ["#ff5c8a", "#ff8fb1", "#ff4d6d", "#ffb3c6", "#e63976", "#ff2e63"];

  const HEARTS_PER_CLICK = 6;

  document.addEventListener("pointerdown", (e) => {
    const x = e.clientX;
    const y = e.clientY;

    for (let i = 0; i < HEARTS_PER_CLICK; i++) {
      spawnHeart(x, y, i);
    }
  });

  function spawnHeart(x, y, index) {
    const el = document.createElement("div");
    el.className = "click-heart";

    const sym = HEART_SYMBOLS[Math.floor(Math.random() * HEART_SYMBOLS.length)];
    el.textContent = sym;

    if (sym === "❤" || sym === "♥") {
      el.style.color = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
    }

    const angle = Math.random() * Math.PI * 2;
    const distance = 40 + Math.random() * 70;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance - 30;

    const rot = (Math.random() * 60 - 30) + "deg";
    const size = 14 + Math.random() * 14;

    el.style.setProperty("--dx", dx + "px");
    el.style.setProperty("--dy", dy + "px");
    el.style.setProperty("--rot", rot);
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.fontSize = size + "px";
    el.style.animationDelay = (index * 0.03) + "s";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 1000 + index * 30);
  }
})();
